<title>Municipal Hall Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<style>
/* Layout: directory panel (search, details, list) beside a pan/zoom floor plan; stacks on phones with the map first. */
:root {
  --bg: #EDF0F3;
  --panel: #FFFFFF;
  --ink: #13202B;
  --muted: #566573;
  --line: #D2D9E0;
  --plan-bg: #FAFBFC;
  --plan-line: #4E5A66;
  --sel: #D9480F;
  --on-sel: #FFFFFF;
  --focus: #1D5FD1;
  --zone-op: .30;
  --zone-op-soft: .14;
  --c-exec: #5557C9;
  --c-finance: #B87A0E;
  --c-planning: #1A8A6A;
  --c-social: #C23A63;
  --c-civil: #2272B8;
  --c-public: #7F8C9A;
  --c-restroom: #2F94AE;
  --c-storage: #98A0A8;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D141A; --panel: #151E26; --ink: #E7EEF3; --muted: #93A3B1; --line: #28343E;
    --plan-bg: #0A1015; --plan-line: #8796A4; --sel: #FF8A57; --on-sel: #1A0D05; --focus: #7FB0FF;
    --zone-op: .30; --zone-op-soft: .16;
    --c-exec: #9C9EF4; --c-finance: #E6B04A; --c-planning: #4CC9A3; --c-social: #F27C9C;
    --c-civil: #66B3F2; --c-public: #9AA7B5; --c-restroom: #5BC0D8; --c-storage: #8D96A0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D141A; --panel: #151E26; --ink: #E7EEF3; --muted: #93A3B1; --line: #28343E;
  --plan-bg: #0A1015; --plan-line: #8796A4; --sel: #FF8A57; --on-sel: #1A0D05; --focus: #7FB0FF;
  --zone-op: .30; --zone-op-soft: .16;
  --c-exec: #9C9EF4; --c-finance: #E6B04A; --c-planning: #4CC9A3; --c-social: #F27C9C;
  --c-civil: #66B3F2; --c-public: #9AA7B5; --c-restroom: #5BC0D8; --c-storage: #8D96A0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.app {
  max-width: 1440px; margin: 0 auto; min-height: 100%;
  display: grid; gap: 14px; align-content: start;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "head" "search" "stage" "detail" "list" "foot";
}
header { grid-area: head; display: flex; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; }
h1 { margin: 0; font: 700 clamp(24px, 4.6vw, 34px)/1.05 var(--display); letter-spacing: -.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 15px; }

.warn { flex: 1 1 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--sel); background: color-mix(in srgb, var(--sel) 10%, var(--panel)); font-size: 14px; }
.warn[hidden] { display: none; }
.search { grid-area: search; display: grid; gap: 10px; min-width: 0; }
.field { position: relative; }
.field svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
#q {
  width: 100%; height: 50px; padding: 0 44px 0 44px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--panel); font-size: 16px;
}
#q::placeholder { color: var(--muted); }
#q:focus-visible { outline-offset: 0; border-color: var(--focus); }
#clear { position: absolute; right: 6px; top: 50%; translate: 0 -50%; width: 38px; height: 38px; border: 0; background: none; border-radius: 8px; color: var(--muted); font-size: 22px; line-height: 1; }
#clear[hidden] { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 12px;
  border: 1.5px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 14px;
}
.chip i { width: 12px; height: 12px; border-radius: 50%; background: var(--sw); flex: none; }
.chip[aria-pressed="true"] { border-color: var(--sw); background: color-mix(in srgb, var(--sw) 16%, var(--panel)); font-weight: 700; }

.stage { grid-area: stage; min-width: 0; display: grid; gap: 10px; grid-template-rows: auto minmax(0, 1fr); }
.floors { display: inline-flex; gap: 6px; padding: 4px; border-radius: 12px; background: var(--panel); border: 1.5px solid var(--line); justify-self: start; max-width: 100%; }
.floor-btn { border: 0; background: none; padding: 0 16px; min-height: 40px; border-radius: 9px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.floor-btn[aria-selected="true"] { background: var(--ink); color: var(--panel); }
.floor-btn .n { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--sel); color: var(--on-sel); font-size: 12px; display: inline-grid; place-items: center; }
.floor-btn .n[hidden] { display: none; }
.mapwrap {
  position: relative; border-radius: 14px; overflow: hidden; border: 1.5px solid var(--line);
  background: var(--plan-bg); height: clamp(360px, 64vh, 700px); min-height: 0;
}
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; user-select: none; -webkit-user-select: none; }
#map.drag { cursor: grabbing; }
.base { fill: none; stroke: var(--plan-line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; opacity: .8; pointer-events: none; }
.zone { fill: var(--cat); fill-opacity: var(--zone-op); stroke: var(--cat); stroke-width: 1; vector-effect: non-scaling-stroke; transition: fill-opacity .15s, opacity .2s; cursor: pointer; }
.zone.soft { fill-opacity: var(--zone-op-soft); }
.zone.pinzone { stroke-dasharray: 4 3; }
.zone:hover { fill-opacity: .5; }
.zone.dim { opacity: .12; }
.zone.sel { fill-opacity: .6; }
.zone:focus-visible { outline: none; stroke: var(--focus); stroke-width: 3; }
.c-exec { --cat: var(--c-exec); } .c-finance { --cat: var(--c-finance); } .c-planning { --cat: var(--c-planning); }
.c-social { --cat: var(--c-social); } .c-civil { --cat: var(--c-civil); } .c-public { --cat: var(--c-public); }
.c-restroom { --cat: var(--c-restroom); } .c-storage { --cat: var(--c-storage); }
.ring { fill: none; stroke: var(--sel); stroke-width: 3.5; vector-effect: non-scaling-stroke; pointer-events: none; stroke-linejoin: round; }
.lbl { font-family: var(--body); font-weight: 700; fill: var(--ink); stroke: var(--plan-bg); stroke-linejoin: round; paint-order: stroke; text-anchor: middle; pointer-events: none; }
.stair rect { fill: var(--panel); stroke: var(--plan-line); stroke-width: 1.5; }
.stair path { fill: none; stroke: var(--plan-line); stroke-width: 2; stroke-linejoin: round; }
.marker { pointer-events: none; }
.marker path { fill: var(--sel); stroke: var(--on-sel); stroke-width: 2; }
.marker circle { fill: var(--on-sel); }
.marker.drop { animation: drop .35s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes drop { from { opacity: 0; translate: 0 -14px; } to { opacity: 1; translate: 0 0; } }

.zoom { position: absolute; right: 10px; bottom: 10px; display: grid; gap: 6px; }
.zoom button { width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); font-size: 22px; font-weight: 700; line-height: 1; display: grid; place-items: center; }
.zoom button.fit { font-size: 13px; }
.tag { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 80px); padding: 8px 12px; border-radius: 10px; background: var(--ink); color: var(--panel); font-weight: 700; font-size: 14px; box-shadow: 0 2px 10px rgb(0 0 0 / .25); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag[hidden] { display: none; }
.hint { position: absolute; left: 10px; top: 10px; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); font-size: 13px; color: var(--muted); pointer-events: none; }

.detail { grid-area: detail; min-width: 0; background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; align-content: start; }
.detail h2 { margin: 0; font: 700 clamp(22px, 3.4vw, 28px)/1.1 var(--display); letter-spacing: -.005em; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--line); }
.badge i { width: 10px; height: 10px; border-radius: 50%; background: var(--cat); }
.head { display: grid; gap: 2px; padding: 12px 14px; border-radius: 10px; background: var(--bg); }
.head small { color: var(--muted); font-size: 13px; }
.head b { font: 700 20px/1.2 var(--display); }
.head b.none { font: 400 16px/1.3 var(--body); color: var(--muted); }
.head span { color: var(--muted); }
.note { margin: 0; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); font-weight: 700; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.empty { margin: 0; color: var(--muted); }
.empty b { color: var(--ink); }

.list { grid-area: list; min-width: 0; min-height: 0; display: grid; gap: 14px; align-content: start; }
.list h3 { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.group { display: grid; gap: 4px; }
.row {
  display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left;
  width: 100%; min-height: 56px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid transparent; background: var(--panel);
}
.row:hover { border-color: var(--line); }
.row[aria-current="true"] { border-color: var(--sel); background: color-mix(in srgb, var(--sel) 9%, var(--panel)); }
.row i { width: 12px; height: 12px; border-radius: 50%; background: var(--cat); }
.row .t { display: grid; min-width: 0; }
.row .t b { font-weight: 700; overflow-wrap: anywhere; }
.row .t span { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.row .fl { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.none-found { padding: 12px; border: 1.5px dashed var(--line); border-radius: 10px; color: var(--muted); }
footer { grid-area: foot; color: var(--muted); font-size: 13px; display: flex; gap: 6px 18px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; translate: -50% 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--panel); font-weight: 700; z-index: 20; }
.toast[hidden] { display: none; }

@media (min-width: 920px) {
  .app {
    height: 100%; grid-template-columns: 390px minmax(0, 1fr); column-gap: 20px;
    grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    grid-template-areas: "head head" "search stage" "detail stage" "list stage" "foot foot";
  }
  .mapwrap { height: 100%; }
  .list { overflow-y: auto; padding-right: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  .marker.drop { animation: none; }
  .zone { transition: none; }
}
</style>

<div class="app">
  <header>
    <h1 id="ttl">Municipal Hall</h1>
    <p id="sub">Find an office and see who heads it</p>
    <div class="warn" id="warn" role="alert" hidden></div>
  </header>

  <section class="search" aria-label="Search offices">
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Search office, person or service" aria-label="Search offices, people, or services">
      <button id="clear" type="button" aria-label="Clear search" hidden>&times;</button>
    </div>

  <section class="stage" aria-label="Floor plan">
    <div class="floors" id="floors" role="tablist" aria-label="Floor"></div>
    <div class="mapwrap" id="mapwrap">
      <svg id="map" role="group" aria-label="Interactive floor plan"></svg>
      <div class="hint" id="hint">Drag to move. Pinch or scroll to zoom.</div>
      <div class="tag" id="tag" hidden></div>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
        <button type="button" id="zfit" class="fit" aria-label="Show whole floor">Fit</button>
      </div>
    </div>
  </section>

  <section class="detail" id="detail" aria-live="polite"></section>
  <section class="list" id="list" aria-label="Directory"></section>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

    box.append(h('button', { class: 'chip', type: 'button', style: `--sw: var(--c-${c})`, 'aria-pressed': String(state.cat === c),
      onclick: () => { state.cat = state.cat === c ? null : c; refresh(); } }, h('i'), CHIP_LABEL[c] || catName(c)));
  }
}
function applyFilterToMap() {
  const on = filtering();
  for (const z of G.zones) z.el.classList.toggle('dim', on && z.id !== state.sel && !zoneMatches(z));
}
function renderList() {
  const box = $('#list'); box.replaceChildren();
  const on = filtering();
  const offs = [...OFF.values()].filter((o) => { const z = ZONES.get(o.id); return z && zoneMatches(z); });
  let any = false;
  for (const c of CAT_ORDER) {
    const items = offs.filter((o) => o.category === c).sort((a, b) => a.name.localeCompare(b.name));
    if (!items.length) continue; any = true;
    box.append(h('div', { class: 'group' }, h('h3', {}, catName(c)), items.map(row)));
  }
  if (on) {
    const others = G.zones.filter((z) => !z.o && zoneMatches(z) && (state.q.trim() || state.cat === z.c))
      .sort((a, b) => a.n.localeCompare(b.n) || a.f.localeCompare(b.f));
    if (others.length) { any = true; box.append(h('div', { class: 'group' }, h('h3', {}, 'Other places'), others.map(row))); }
  }
  if (!any) box.append(h('div', { class: 'none-found' }, 'No match. Try an office name, a service such as "business permit", or a person’s name.'));
}
function row(x) {
  const z = x.f ? x : ZONES.get(x.id); const o = z.o && OFF.get(z.o);
  const sub = o ? (o.head ? o.head + (o.title ? ' · ' + o.title : '') : (o.title || 'Head not yet listed')) : catName(z.c);
  return h('button', { class: 'row c-' + z.c, type: 'button', 'aria-current': String(state.sel === z.id), onclick: () => select(z.id, { focus: true, scroll: true }) },
    h('i'), h('span', { class: 't' }, h('b', {}, zoneName(z)), h('span', {}, sub)), h('span', { class: 'fl' }, FLOOR_SHORT[z.f]));
}
function renderDetail() {
  const box = $('#detail'); box.replaceChildren();
  const z = state.sel && ZONES.get(state.sel);
  if (!z) {
    box.append(h('p', { class: 'empty' }, h('b', {}, 'Tap a room on the map'), ' to see its name and who heads it, or pick an office from the list.'));
    return;
  }
  const o = z.o && OFF.get(z.o);
  box.append(
    h('h2', {}, zoneName(z)),
    h('div', { class: 'meta c-' + z.c }, h('span', { class: 'badge' }, h('i'), catName(z.c)), h('span', { class: 'badge' }, G.floors[z.f].name)));
  if (o) {
    box.append(h('div', { class: 'head' }, h('small', {}, 'Headed by'),
      o.head ? h('b', {}, o.head) : h('b', { class: 'none' }, 'Name not yet listed'),
      o.title ? h('span', {}, o.title) : null));
    if (o.notes) box.append(h('p', { class: 'note' }, o.notes));
  } else {
    box.append(h('p', { class: 'note' }, z.c === 'restroom' ? 'Restroom (comfort room).' : 'Shared space, not an office.'));
  }
  box.append(h('div', { class: 'actions' },
    h('button', { class: 'btn primary', type: 'button', onclick: () => { if (z.f !== state.floor) setFloor(z.f, true); focusZone(z); } }, 'Show on map'),
    h('button', { class: 'btn', type: 'button', onclick: copyLink }, 'Copy link')));
}
function refresh() {
  renderChips(); renderFloors(); applyFilterToMap(); renderList(); updateLabels();
  $('#clear').hidden = !state.q;
}
function select(id, opt) {
  opt = opt || {};
  const z = ZONES.get(id); if (!z) return;
  state.sel = id;
  if (z.f !== state.floor) setFloor(z.f, true);
  for (const k of ZONES.values()) k.el.classList.toggle('sel', k.id === id);
  ringLayer.setAttribute('d', z.d);
  floorG[z.f].g.append(ringLayer, markerG);
  markerG.style.display = '';
  markerG.classList.remove('drop'); void markerG.getBoundingClientRect(); markerG.classList.add('drop');
  const tag = $('#tag'); tag.hidden = false; tag.textContent = zoneName(z);
  if (opt.focus) focusZone(z);
  applyFilterToMap(); applyCam(); renderDetail(); renderList();
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* hash not available */ }
  if (opt.scroll && innerWidth < 920) $('#mapwrap').scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
}
function copyLink() {
  const url = location.href.split('#')[0] + '#' + state.sel;
  const done = () => toast('Link copied');
  const fallback = () => {
    const i = h('input', { value: url, 'aria-hidden': 'true', style: 'position:fixed;opacity:0' }); document.body.append(i); i.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast(url); } i.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, fallback); else fallback();
}
let tt = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2200); }

/* ---------- boot ---------- */
(async function () {
  await loadOffices();
  const b = DATA.building || {};
  $('#ttl').textContent = b.title || 'Municipal Hall';
  $('#sub').textContent = b.subtitle || '';
  document.title = (b.title ? b.title + ' Map' : 'Municipal Hall Map');
  buildMap();
  const foot = $('#foot');
  foot.append(h('span', {}, 'Gray areas are shared spaces and storage.'));
  if (b.updated) foot.append(h('span', {}, 'Directory updated ' + b.updated));
  if (usedFallback) {
    const w = $('#warn');
    const msg = {
      file: 'This page was opened directly from a file, so the browser blocked offices.json. The built-in sample list is showing, not your updates. Upload index.html and offices.json to your portal or web server and open the page from there.',
      format: 'offices.json has a formatting error, so the built-in sample list is showing, not your updates. Check for a missing comma, quotation mark or bracket, then paste the file into jsonlint.com to find the line. Details: ' + loadMsg,
      fetch: 'offices.json could not be loaded (' + loadMsg + '). Make sure it is in the same folder as index.html. The built-in sample list is showing, not your updates.'
    }[loadErr];
    w.textContent = msg; w.hidden = false;
  }
  $('#q').addEventListener('input', (e) => { state.q = e.target.value; refresh(); });
  $('#clear').addEventListener('click', () => { state.q = ''; $('#q').value = ''; refresh(); $('#q').focus(); });
  $('#zin').addEventListener('click', () => { const [w, hh] = size(); zoomAt(1.5, w / 2, hh / 2); });
  $('#zout').addEventListener('click', () => { const [w, hh] = size(); zoomAt(1 / 1.5, w / 2, hh / 2); });
  $('#zfit').addEventListener('click', () => { fitFloor(state.floor, true); touched = false; });
  addEventListener('resize', () => { if (!touched) fitFloor(state.floor, false); });
  setFloor('gf');
  renderChips(); renderList(); renderDetail();
  const id = decodeURIComponent((location.hash || '').slice(1));
  if (id && ZONES.has(id)) select(id, { focus: true });
})();
</script>
